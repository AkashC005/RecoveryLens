# RecoveryLens on Render — infrastructure as a file, so the deployment is
# reviewable rather than a sequence of clicks nobody wrote down.
#
# NOTHING SECRET IS IN THIS FILE. Every key is `sync: false`, which means Render
# prompts for it once and stores it encrypted. A key committed to a repository
# is a key that has been leaked, whatever the repository's visibility.

services:
  - type: web
    name: recoverylens
    runtime: docker
    region: singapore          # closest to India — noticeably snappier on the day
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health

    envVars:
      # --- required for the model-backed features ---
      # Without these the app still runs: guidance falls back to deterministic
      # lookup, triage falls back to rules, and extraction is unavailable.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # --- CLOSES THE DOOR ON A PUBLIC URL ---
      # Registration is open by default, which is right for a laptop and wrong
      # for a link anyone can find. With this set, an account needs the code.
      # Set it to something long. This is the single most important variable here.
      - key: RECOVERYLENS_SIGNUP_CODE
        sync: false

      # --- messaging: leave unset unless you are demonstrating real sends ---
      # The variable is TWILIO_FROM, not TWILIO_WHATSAPP_FROM, and it must carry
      # the channel prefix: whatsapp:+14155238886. Twilio treats
      # `whatsapp:+1...` and `+1...` as different channels and refuses the
      # mismatch with error 21910.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

      # Without this the sender writes messages to the log instead of sending
      # them — the app looks like it worked and no phone ever buzzes. Set it to
      # "twilio" only once the three variables above are filled in.
      - key: RECOVERYLENS_MESSAGING
        sync: false

      # Where Twilio posts inbound replies, including STOP. Must be the DEPLOYED
      # url + /api/webhooks/twilio, and must also be set in the Twilio console.
      # Leave unset if you are demonstrating messaging from your laptop instead.
      - key: TWILIO_WEBHOOK_URL
        sync: false

      # The background sender stays OFF. A public deployment that starts
      # messaging families on a timer is not something to switch on the night
      # before a pitch — send from the UI button instead.
      - key: RECOVERYLENS_SCHEDULER
        value: "0"

      - key: ALLOWED_ORIGINS
        value: "https://recoverylens.onrender.com"

# ---------------------------------------------------------------- persistence
# THERE IS NO PERSISTENT DISK HERE, because Render's free tier does not allow
# one. The database is a SQLite file inside the container, so it is wiped on
# every restart — and a free instance restarts when it wakes from sleep, not
# only when you redeploy.
#
# WHAT THAT MEANS ON THE DAY: a patient created during a rehearsal at 10:00 is
# gone by 11:00 if the service napped in between. Create your demo data in the
# same sitting you present it. That is what you would do anyway.
#
# TO MAKE IT PERSIST, pick one:
#
#   1. Paid instance + disk ($7/month, cancel after the finale). Change
#      `plan: free` to `plan: starter` above, then add:
#
#        disk:
#          name: recoverylens-data
#          mountPath: /var/data
#          sizeGB: 1
#
#      and set DATABASE_URL to sqlite:////var/data/recoverylens.db
#      This also stops the instance sleeping, which is the other free-tier problem.
#
#   2. Render's free Postgres. Persists, costs nothing, but needs
#      psycopg2-binary added to requirements.txt and the whole app re-tested
#      against Postgres. Do NOT attempt this on the day of a pitch.
